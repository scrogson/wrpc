[package]
name = "wrpc_nif"
version = "0.1.0"
authors = ["wRPC Contributors"]
edition = "2021"

[lib]
name = "wrpc_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = "0.34"
wrpc-transport = { version = "0.28", features = ["net"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "macros"] }
bytes = "1"
anyhow = "1"
